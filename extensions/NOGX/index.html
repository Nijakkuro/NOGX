<!DOCTYPE html>
<html lang="en">
${GM_HTML5_PreHead}
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>${GM_HTML5_BrowserTitle}</title>
  <link rel="shortcut icon" href="html5game/icon.png">
  ${GM_HTML5_PreStyle}

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(to top, #20375a, #245076, #276b92, #2987ac, #2fa4c4);
      font-family: sans-serif;
    }

    canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      
      max-width: 100vw;
      max-height: 100vh;

      display: none;
      image-rendering: optimizeSpeed;
      touch-action: none;

      box-shadow: 0 0 4em rgba(0,0,0,0.5);
      z-index: 1;
    }

    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
    }

    .progress-bar {
      position: absolute;
      top: calc(50% + 30px);
      left: 50%;
      transform: translateX(-50%);
      width: 256px;
      height: 24px;

      background: linear-gradient(
        to right,
        #a3e3ff 0%,
        #ffffff var(--progress),
        #23395c var(--progress),
        #23395c 100%
      );

      border-radius: 8px;
    }

    /* fix for GamePush background */
    .gp-custom-background {
      position: fixed !important;
      inset: 0 !important;
      z-index: 0 !important;
      pointer-events: none;
    }
  </style>

  ${GM_HTML5_PostStyle}
</head>

${GM_HTML5_PostHead}
${GM_HTML5_PreBody}
<body>
	<!-- NOGX_CODE_COMPRESSION_START -->
	<script src="html5game/fflate.min.js"></script>
	<script>
	window.Module = window.Module || {};
	Module.instantiateWasm = function (imports, successCallback) {
		function prepareWasmImports(wasmImports) {
			if (wasmImports && wasmImports.a && wasmImports.a.Yv !== undefined) {
				wasmImports.a.Ya = wasmImports.a.Yv;
			}
			return wasmImports;
		}

		(async () => {
			let compressed = null;
			let wasmBinary = null;
			async function loadNormalWasm() {
				console.warn("Loading fallback wasm");
				const response = await fetch("runner.wasm");
				if (!response.ok) {
					throw new Error("Fallback wasm not found");
				}
				wasmBinary = new Uint8Array(await response.arrayBuffer());
				const result = await WebAssembly.instantiate(wasmBinary, prepareWasmImports(imports));
				wasmBinary = null;
				successCallback(result.instance);
			}
			try {
				try {
					const response = await fetch("runner.wbin");
					if (!response.ok) {
						throw new Error("Compressed wasm not found");
					}
					compressed = new Uint8Array(await response.arrayBuffer());
					wasmBinary = fflate.decompressSync(compressed);
					compressed = null;
					console.log("Compressed wasm loaded from runner.wbin:", wasmBinary.length);
					const result = await WebAssembly.instantiate(
						wasmBinary,
						prepareWasmImports(imports)
					);
					wasmBinary = null;
					successCallback(result.instance);
				} catch (e) {
					console.warn("Compressed wasm failed", e);
					compressed = null;
					wasmBinary = null;
					await loadNormalWasm();
				}
			} catch (err) {
				console.error("WASM load failed", err);
			}
		})();
		return {};
	};
	</script>
	<!-- NOGX_CODE_COMPRESSION_END -->

	<script>
	(function () {
		const _origLog = console.log;
		console.log = function () {
			let s = "";
			for(let i = 0; i < arguments.length; i++) {
				try { s += arguments[i]; } catch (_) {}
				if (i + 1 < arguments.length) s += " ";
			}
			s = s.trim();
			if (!s || s === "<empty string>" ||
				(
					s.includes("Prevented call into an uninitialised yyal") &&
					s.includes("Audio_EngineInvokeCallback")
				)
			) { return; }
			return _origLog.apply(console, arguments);
		};
		window.alert = function(msg) {
			console.error('[GM alert]', msg);
			try { window.parent.postMessage({ type: 'gm-alert', msg }, '*'); } catch(e) {}
		};
		window.onerror = function(msg, src, line, col, err) {
			console.error('[onerror]', msg, src + ':' + line);
			try { window.parent.postMessage({ type: 'onerror', msg, src, line }, '*'); } catch(e) {}
		};
		window.onunhandledrejection = function(e) {
			console.error('[unhandledrejection]', e.reason);
		};
	})();

	(function () {
		const AC = window.AudioContext || window.webkitAudioContext;
		if (!AC) {
			console.warn("AudioContext not supported");
			return;
		}
		if (window.__GXGameAudioPatch && typeof window.__GXGameAudioPatch.teardown === "function") {
			try { window.__GXGameAudioPatch.teardown(); } catch (e0) {}
		}
		let unlocked = false;
		const contexts = new Set();
		const pendingTimeouts = [];
		const EVENTS = [
			'pointerdown',
			'pointerup',
			'touchstart',
			'touchend',
			'mousedown',
			'mouseup',
			'click',
			'keydown'
		];
		function clearPendingTimeouts() {
			while (pendingTimeouts.length) {
				const id = pendingTimeouts.pop();
				try { clearTimeout(id); } catch (e) {}
			}
		}
		async function resumeContext(ctx) {
			if (!ctx) return;
			try {
				if (ctx.state !== 'running' && ctx.state !== 'closed') {
					await ctx.resume();
				}
			} catch (e) {}
		}
		function scheduleResume(ctx, ms) {
			const id = setTimeout(function () { resumeContext(ctx); }, ms);
			pendingTimeouts.push(id);
		}
		async function unlockAllAudio() {
			if (unlocked) return;
			unlocked = true;
			removeListeners();
			clearPendingTimeouts();
			for (const ctx of contexts) {
				await resumeContext(ctx);
				scheduleResume(ctx, 0);
				scheduleResume(ctx, 100);
				scheduleResume(ctx, 500);
			}
		}
		function addListeners() {
			EVENTS.forEach(type => {
				document.addEventListener(type, unlockAllAudio, {
					capture: true,
					passive: false
				});
				window.addEventListener(type, unlockAllAudio, {
					capture: true,
					passive: false
				});
			});
		}
		function removeListeners() {
			EVENTS.forEach(type => {
				document.removeEventListener(type, unlockAllAudio, true);
				window.removeEventListener(type, unlockAllAudio, true);
			});
		}
		const origClose = (typeof AC.prototype.close === "function") ? AC.prototype.close : null;
		class PatchedAudioContext extends AC {
			constructor(...args) {
				super(...args);
				contexts.add(this);
				Promise.resolve().then(() => resumeContext(this));
				scheduleResume(this, 0);
				scheduleResume(this, 50);
				scheduleResume(this, 250);
			}
			close() {
				try { contexts.delete(this); } catch (e) {}
				return origClose ? origClose.apply(this, arguments) : undefined;
			}
		}
		window.AudioContext = PatchedAudioContext;
		if (window.webkitAudioContext) {
			window.webkitAudioContext = PatchedAudioContext;
		}
		function onWindowMessage(event) {
			if (event.data === 'yt-playable-user-gesture') {
				unlocked = false;
				unlockAllAudio();
			}
		}
		window.addEventListener('message', onWindowMessage);
		let tornDown = false;
		function teardown() {
			if (tornDown) return;
			tornDown = true;
			removeListeners();
			clearPendingTimeouts();
			try { window.removeEventListener('message', onWindowMessage); } catch (e2) {}
			contexts.forEach(function (ctx) {
				try {
					if (ctx && ctx.state !== 'closed') { ctx.suspend(); }
				} catch (e4) {}
			});
			contexts.clear();
			try { window.AudioContext = AC; } catch (e5) {}
			try { if (window.webkitAudioContext) { window.webkitAudioContext = AC; } } catch (e6) {}
			unlocked = false;
			try { delete window.__GXGameAudioPatch; } catch (e8) {}
		}
		try {
			window.addEventListener('pagehide', teardown, { capture: true });
			window.addEventListener('freeze', teardown, { capture: true });
			window.addEventListener('unload', teardown, { capture: true });
		} catch (e7) {}
		window.__GXGameAudioPatch = { teardown: teardown };

		addListeners();
		console.log("GXGame Audio Unlock Patch installed");
	})();
	</script>

  <canvas id="canvas" width="${GM_HTML5_GameWidth}" height="${GM_HTML5_GameHeight}" ${GM_HTML5_InjectCenterStyle}>
	<p>Your browser doesn't support HTML5 canvas.</p>
  </canvas>

  <div id="status">0%</div>
  <div class="progress-bar" id="loadingProgress"></div>

  <script>
	var Module = window.Module || {};
	Object.assign(Module, {
	  canvas: document.getElementById("canvas"),
	  _startTime: null,
	  _progressTimer: null,
	  _totalDeps: 0,
	  
	  show: function () {
		Module.canvas.style.display = "block";
		document.getElementById("status").style.display = "none";
		document.getElementById("loadingProgress").style.display = "none";
	  },
	  
	  setStatus: function (text) {
		if (text === "Running..." || text === "") return;
		document.getElementById("status").textContent = text || "";
	  },
	  
	  _updateProgressUI: function (value) {
		const clamped = Math.max(0, Math.min(90, value));
		const progress = Math.floor(clamped) + "%";
		const progressElem = document.getElementById("loadingProgress");
		if (progressElem) {
		  progressElem.style.setProperty("--progress", progress);
		}
		this.setStatus(progress);
	  },
	  
	  _computeFakeProgress: function () {
		if (this._startTime === null) return 0;
		const elapsed = Date.now() - this._startTime;
		let p = (elapsed / 30000) * 90;
		if (this.totalDependencies <= 3) {
		  p = Math.max(p, 86);
		}
		return Math.min(90, p);
	  },
	  
	  monitorRunDependencies: function (left) {
		this._totalDeps = Math.max(this._totalDeps, left);
		if (this._startTime === null) {
		  this._startTime = Date.now();
		  this._progressTimer = setInterval(() => {
			const p = this._computeFakeProgress();
			this._updateProgressUI(p);
			if (p >= 90) {
			  clearInterval(this._progressTimer);
			  this._progressTimer = null;
			}
		  }, 100);
		}
		const p = this._computeFakeProgress();
		this._updateProgressUI(p);
	  }
	});

    Module.canvas.style.display = "none";

    /* ===== GameMaker hooks ===== */

    var g_pWadLoadCallback;
    function setWadLoadCallback(cb) { g_pWadLoadCallback = cb; }

    var g_pAddAsyncMethod = -1;
    function setAddAsyncMethod(m) { g_pAddAsyncMethod = m; }

    var g_pJSExceptionHandler;
    function setJSExceptionHandler(handler) {
      if (typeof handler === "function") g_pJSExceptionHandler = handler;
    }

    function hasJSExceptionHandler() {
      return typeof g_pJSExceptionHandler === "function";
    }

    function doJSExceptionHandler(json) {
      if (g_pJSExceptionHandler) {
        g_pJSExceptionHandler(JSON.parse(json));
      }
    }

    function manifestFiles() {
      return [
        "runner.data",
        "runner.js",
        "runner.wasm",
        "audio-worklet.js",
        "game.unx",
        "options.ini"
      ].join(";");
    }

    function manifestFilesMD5() {
      return undefined;
    }

    function onFirstFrameRendered() {
      console.log("First frame rendered");
      Module.show();
    }

    function onGameSetWindowSize() {}

    /* resize observer (GameMaker) */
    var __NOGX_ready = false;

    function updateCanvasSize() {
      if (__NOGX_ready) {
        __NOGX_update_canvas_size();
      }
    }

    const resizeObserver = new ResizeObserver(() =>
      window.requestAnimationFrame(updateCanvasSize)
    );

    resizeObserver.observe(document.body);

    /* disable context menu */
    document.addEventListener("contextmenu", e => e.preventDefault());

    document.addEventListener("touchstart", e => {
      if (e.target === document.body || e.target === Module.canvas) {
        e.preventDefault();
      }
    }, { passive: false });

  </script>
  
  <script>
	  const WAIT_MESSAGES = {
		en: "Waiting for window",
		ru: "Ожидание окна",
		zh: "等待窗口",
		es: "Esperando la ventana",
		hi: "विंडो की प्रतीक्षा",
		ar: "في انتظار النافذة",
		pt: "Aguardando a janela",
		fr: "En attente de la fenêtre",
		de: "Warte auf Fenster",
		ja: "ウィンドウを待っています",
		ko: "창을 기다리는 중",
	  };

	  function getWaitMessage() {
		const langs = navigator.languages || [navigator.language || "en"];
		for (const lang of langs) {
		  const code = lang.split("-")[0].toLowerCase();
		  if (WAIT_MESSAGES[code]) return WAIT_MESSAGES[code];
		}
		return WAIT_MESSAGES.en;
	  }

	  function waitForSize(callback) {
		const base = getWaitMessage();
		const statusEl = document.getElementById("status");
		let frame = 0;
		const DOTS = ["", ".", "..", "..."];
		const CYCLE = 30;

		function check() {
		  if (window.innerWidth > 0 && window.innerHeight > 0) {
			statusEl.textContent = "0%";
			callback();
		  } else {
			statusEl.textContent = base + DOTS[Math.floor(frame / CYCLE) % DOTS.length];
			frame++;
			requestAnimationFrame(check);
		  }
		}
		check();
	  }

	  waitForSize(function () {
		const script = document.createElement("script");
		script.src = "runner.js";
		document.body.appendChild(script);
	  });
	</script>

</body>

${GM_HTML5_PostBody}
</html>
